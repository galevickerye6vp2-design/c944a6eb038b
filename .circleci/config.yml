            command -v sha256sum >/dev/null && sha256sum /tmp/ci-data/IndigoQueueReport | cut -c1-10 || echo "no-sha256"
      - persist_to_workspace:
          root: /tmp/ci-data
          paths:
            - 'IndigoQueueReport'
